<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Grab</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1f2937; --accent-fg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f2229; --fg:#f3f4f6; --muted:#9ca3af; --line:#2f333c; --accent:#f3f4f6; --accent-fg:#111827; } }
  * { box-sizing: border-box; }
  body { margin:0; width:360px; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--line); }
  header strong { font-size:14px; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; }
  main { max-height:380px; overflow:auto; padding:10px 14px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .tile { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:2px solid transparent; cursor:pointer; background:var(--line); padding:0; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile.on { border-color:var(--accent); }
  .tile span { position:absolute; left:4px; bottom:4px; padding:1px 5px; border-radius:4px; background:rgba(0,0,0,.65); color:#fff; font-size:10px; }
  .tile i { position:absolute; right:4px; top:4px; width:16px; height:16px; border-radius:50%; background:var(--accent); color:var(--accent-fg); font:700 10px/16px system-ui; text-align:center; font-style:normal; display:none; }
  .tile.on i { display:block; }
  footer { padding:10px 14px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  #status { flex:1; color:var(--muted); }
  button.go { border:0; border-radius:8px; padding:8px 14px; background:var(--accent); color:var(--accent-fg); font:600 13px system-ui; cursor:pointer; }
  button.go:disabled { opacity:.4; cursor:default; }
  .empty { padding:28px 14px; text-align:center; color:var(--muted); }
  .head-actions { display:flex; align-items:center; gap:12px; }
  .icon-btn { display:grid; place-items:center; width:28px; height:28px; border:0; border-radius:8px; background:none; color:var(--muted); cursor:pointer; }
  .icon-btn:hover { background:var(--line); color:var(--fg); }
  .icon-btn svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .text-btn { border:0; background:none; padding:4px 2px; color:var(--fg); font:600 13px system-ui; cursor:pointer; }
  #settingsView { height:470px; }
  #settingsView iframe { width:100%; height:100%; border:0; display:block; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <strong id="title">Images on this page</strong>
  <div class="head-actions" id="listActions">
    <label><input type="checkbox" id="all"> Select all</label>
    <button class="icon-btn" id="gear" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <button class="text-btn" id="done" type="button" hidden>Done</button>
</header>
<main id="listView"><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></main>
<footer id="listFooter">
  <span id="status"></span>
  <button class="go" id="go" disabled>Download</button>
</footer>
<div id="settingsView" hidden></div>
<script src="popup.js"></script>
</body>
</html>
